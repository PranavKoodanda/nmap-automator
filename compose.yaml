services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:?Set APP_AUTH_SECRET in root .env; see .env.example}
      FRONTEND_CORS_ORIGINS: http://localhost:8080
      MAX_CONCURRENT_SCANS: ${MAX_CONCURRENT_SCANS:-2}
      MAX_PENDING_SCANS: ${MAX_PENDING_SCANS:-4}
    expose:
      - "10000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=2)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_API_MODE: api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
